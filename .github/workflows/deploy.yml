name: Deploy to GitHub Pages

# 推送到 main 后自动构建并发布；也可在 Actions 页面手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 安装依赖、执行 Astro 构建，并上传 Pages artifact。
      - uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 仓库 Settings → Pages 的 Source 必须设为 GitHub Actions。
      - id: deployment
        uses: actions/deploy-pages@v4
